spring.application.name=tick-tracker
server.port=8080

# File-based H2 so ingested data survives restarts (stored in ./data/)
spring.datasource.url=jdbc:h2:file:./data/ticks;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Elanco upstream API (no auth needed, but rate limited: 429 => wait ~60s)
elanco.api.base-url=https://dev-task.elancoapps.com/data
elanco.api.max-retries=5
elanco.api.rate-limit-wait-seconds=61

# Swagger UI: /swagger-ui.html   OpenAPI JSON: /v3/api-docs
management.endpoints.web.exposure.include=health,info
